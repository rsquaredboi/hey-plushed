<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plushed — Artist Logo Concepts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;padding:40px 20px}
h1{text-align:center;font-size:2.5rem;font-weight:900;margin-bottom:8px}
.sub{text-align:center;color:#555;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:48px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1200px;margin:0 auto}
.card{background:#111;border:1px solid #1a1a1a;border-radius:16px;overflow:hidden;transition:all .3s;position:relative}
.card:hover{border-color:#ff00d1;transform:translateY(-4px);box-shadow:0 12px 40px rgba(255,0,209,.15)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.card.zoomed{position:fixed;inset:20px;z-index:100;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#0a0a0a}
.card.zoomed img{width:auto;height:100%;max-width:100%;max-height:100%;object-fit:contain;aspect-ratio:auto}
.info{padding:16px 20px}
.info h2{font-size:1.1rem;margin-bottom:4px}
.info p{font-size:.8rem;color:#666;line-height:1.5}
.vote{display:flex;gap:8px;margin-top:12px}
.vote button{padding:6px 16px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid #333;background:transparent;color:#888}
.vote button:hover{border-color:#ff00d1;color:#ff00d1}
.vote button.loved{background:#ff00d1;color:#fff;border-color:#ff00d1}
.vote button.maybe-btn.maybe{background:#ff9900;color:#fff;border-color:#ff9900}
.vote button.nope-btn.nope{background:#333;color:#666;border-color:#333}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99}
.summary{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;z-index:50}
.summary .counts{font-size:.85rem;color:#888}
.summary .counts span{margin-right:16px}
.summary .counts .c-love{color:#ff00d1}
.summary .counts .c-maybe{color:#ff9900}
div.spacer{height:80px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<h1>Artist Logos</h1>
<p class="sub">10 artists. 10 logos. Pick your favorites.</p>

<div class="grid" id="grid"></div>
<div class="spacer"></div>

<div class="summary">
  <div class="counts" id="counts"></div>
  <div style="font-size:.7rem;color:#444">Click image to zoom. Vote below each.</div>
</div>

<script>
const LOGOS = [
  {file:'01-warhol.png',artist:'Andy Warhol',style:'Pop Art',desc:'Screen print 2x2 grid. Bold flat colors. Campbell soup energy. Every quadrant a different colorway.'},
  {file:'02-basquiat.png',artist:'Jean-Michel Basquiat',style:'Neo-Expressionism',desc:'Raw graffiti scrawl. Crowns above the P. Skulls, anatomical heart, arrows. Scratchy chaos with yellow and red splashes.'},
  {file:'03-haring.png',artist:'Keith Haring',style:'Pop Street Art',desc:'Dancing figures forming the letters. Dogs climbing on top. Primary colors with radiant energy lines.'},
  {file:'04-kusama.png',artist:'Yayoi Kusama',style:'Infinity Dots',desc:'Obsessive polka dots covering everything. Infinity net spiral. Hot pink on pink on pink. Mesmerizing.'},
  {file:'05-kaws.png',artist:'KAWS',style:'Contemporary Art',desc:'XX eyes companion character sitting on the logo. Vinyl toy aesthetic. Muted pink and gray. Clean but subversive.'},
  {file:'06-murakami.png',artist:'Takashi Murakami',style:'Superflat',desc:'Rainbow smiling flowers forming a ring. Japanese text below. Kawaii meets fine art. The most on-brand for a plushie company.'},
  {file:'07-banksy.png',artist:'Banksy',style:'Stencil Street Art',desc:'Spray painted on concrete. Girl with heart balloon. Rat climbing a letter. Dripping paint. Subversive softness.'},
  {file:'08-matisse.png',artist:'Henri Matisse',style:'Paper Cutouts',desc:'Torn colored paper shapes forming each letter. Organic, joyful, bold. Jazz album energy.'},
  {file:'09-mondrian.png',artist:'Piet Mondrian',style:'De Stijl',desc:'Grid of thick black lines. Primary color cells. Each letter in its own geometric block. Balanced asymmetry.'},
  {file:'10-obey.png',artist:'Shepard Fairey',style:'Propaganda Art',desc:'TOY REVOLUTION. Red star, radiating lines, plushie face in the center. Revolutionary poster meets toy brand.'},
];

const votes = JSON.parse(localStorage.getItem('plushed_logo_votes')||'{}');
const grid = document.getElementById('grid');

function render(){
  grid.innerHTML='';
  LOGOS.forEach((l,i)=>{
    const v = votes[i]||'';
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <img src="assets/artist-logos/${l.file}" alt="${l.artist}" onclick="this.parentElement.classList.toggle('zoomed')">
      <div class="info">
        <h2>${l.artist} <span style="color:#555;font-weight:400">— ${l.style}</span></h2>
        <p>${l.desc}</p>
        <div class="vote">
          <button class="${v==='love'?'loved':''}" onclick="vote(${i},'love')">❤️ Love it</button>
          <button class="maybe-btn ${v==='maybe'?'maybe':''}" onclick="vote(${i},'maybe')">🤔 Maybe</button>
          <button class="nope-btn ${v==='nope'?'nope':''}" onclick="vote(${i},'nope')">👎 Nope</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateCounts();
}

function vote(i,type){
  votes[i] = votes[i]===type ? '' : type;
  localStorage.setItem('plushed_logo_votes',JSON.stringify(votes));
  render();
}

function updateCounts(){
  const loves = Object.values(votes).filter(v=>v==='love').length;
  const maybes = Object.values(votes).filter(v=>v==='maybe').length;
  const nopes = Object.values(votes).filter(v=>v==='nope').length;
  document.getElementById('counts').innerHTML=`
    <span class="c-love">❤️ ${loves} loved</span>
    <span class="c-maybe">🤔 ${maybes} maybe</span>
    <span>${nopes} nope</span>
    <span style="color:#444">— ${10-loves-maybes-nopes} unvoted</span>
  `;
}

render();
</script>
</body>
</html>
